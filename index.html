<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NORXSTORE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;min-height:100dvh;overflow-x:hidden;font-family:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f5f4fa;color:#1a1a1a}
body{transition:background-color 0.5s ease,color 0.5s ease}
.navbar{display:flex;align-items:center;gap:10px;padding:14px 16px;background:rgba(255,255,255,.98);width:100%;position:sticky;top:0;z-index:50;transition:background-color 0.5s ease;box-shadow:0 2px 14px rgba(124,58,237,.06)}
.logo{font-size:19px;font-weight:800;letter-spacing:-0.5px;white-space:nowrap;user-select:none;-webkit-user-select:none;cursor:pointer;display:flex;align-items:center;gap:4px}
.logo::before{content:'💠';font-size:16px}
.logo span{background:linear-gradient(135deg,#7c3aed,#c026d3);-webkit-background-clip:text;background-clip:text;color:transparent}
.search-bar{flex:1;height:38px;border:1.5px solid #ece9f7;border-radius:12px;background:#f5f4fa;padding:0 14px;font-size:13px;color:#888;outline:none;min-width:0;transition:border-color 0.3s ease,background 0.3s ease}
.nav-icon{width:38px;height:38px;border-radius:12px;background:#f5f4fa;border:1.5px solid #ece9f7;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;position:relative;flex-shrink:0;transition:background 0.3s ease,border-color 0.3s ease}
.nav-icon:active{background:#e5e5e5}
.nav-icon-wrap{position:relative;flex-shrink:0}
.cart-badge{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:#ef4444;color:#fff;font-size:10px;font-weight:700;display:none;align-items:center;justify-content:center;padding:0 5px;z-index:2}
.cart-badge.show{display:flex}

.carousel-wrap{position:relative;width:100vw;margin:0;border-radius:0;overflow:hidden;left:50%;transform:translateX(-50%);box-shadow:0 4px 20px rgba(124,58,237,.1)}
.carousel-track{display:flex;transition:transform .5s ease;width:100%}
.carousel-slide{flex:0 0 100%;position:relative;height:260px}
.slide-bg{width:100%;height:100%;position:relative;background-size:cover;background-position:center}
.slide-overlay{position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.75) 0%,rgba(0,0,0,.2) 50%,transparent 100%)}
.slide-content{position:absolute;bottom:24px;left:16px;right:70px;color:#fff;z-index:2}
.slide-tag{display:inline-block;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1px;padding:4px 10px;border-radius:20px;margin-bottom:8px;backdrop-filter:blur(6px)}
.slide-title{font-size:20px;font-weight:800;margin:0 0 3px;line-height:1.15;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.slide-desc{font-size:12px;margin:0;opacity:.9;line-height:1.4}
.s1 .slide-tag{background:rgba(212,168,67,.3);color:#f5d78e;border:1px solid rgba(212,168,67,.5)}
.s2 .slide-tag{background:rgba(107,78,230,.3);color:#c4b5fd;border:1px solid rgba(107,78,230,.5)}
.s3 .slide-tag{background:rgba(45,212,191,.2);color:#5eead4;border:1px solid rgba(45,212,191,.4)}
.s4 .slide-tag{background:rgba(236,72,153,.25);color:#f9a8d4;border:1px solid rgba(236,72,153,.4)}


.carousel-dots{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:10}
.dot{width:6px;height:6px;border-radius:50%;border:none;background:rgba(255,255,255,.4);padding:0}
.dot.active{background:#fff;width:18px;border-radius:3px}
.slide-counter{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.4);color:#fff;font-size:10px;font-weight:600;padding:3px 8px;border-radius:12px;z-index:10}

.mode-bar{display:flex;align-items:center;justify-content:center;gap:12px;padding:14px 16px;background:#fff;width:100vw;margin:0;border-radius:0;border-top:1px solid #ece9f7;border-bottom:1px solid #ece9f7;position:relative;left:50%;transform:translateX(-50%);transition:background 0.5s ease,border-color 0.5s ease}
.mode-label{font-size:13px;font-weight:600;color:#aaa;transition:color 0.35s ease}
.mode-label.active{color:#1a1a1a}
.toggle-switch{position:relative;width:46px;height:26px;border-radius:13px;background:#ddd;cursor:pointer;border:none;padding:0;flex-shrink:0;transition:background 0.35s ease}
.toggle-switch.on{background:linear-gradient(135deg,#7c3aed,#c026d3)}
.toggle-knob{position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .3s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle-switch.on .toggle-knob{transform:translateX(20px)}

.mode-wrapper{position:relative;width:100%}
.light-section,.dark-section{width:100%;transition:opacity 0.45s cubic-bezier(0.4,0,0.2,1),transform 0.45s cubic-bezier(0.4,0,0.2,1)}
.light-section{opacity:1;transform:translateY(0);position:relative}
.dark-section{opacity:0;transform:translateY(16px);position:absolute;top:0;left:0;right:0;pointer-events:none}
.dark-section.active-mode{opacity:1;transform:translateY(0);position:relative;pointer-events:auto}
.light-section.inactive-mode{opacity:0;transform:translateY(-16px);position:absolute;top:0;left:0;right:0;pointer-events:none}

.light-section{padding:16px 0 30px}
.section-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;padding:0 16px}
.section-title{font-size:16px;font-weight:700}
.section-link{font-size:12px;color:#888}
.cat-chips{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;padding:0 16px 4px;scrollbar-width:none;-ms-overflow-style:none}
.cat-chips::-webkit-scrollbar{display:none}
.cat-chip{padding:8px 17px;border-radius:20px;background:#f5f4fa;border:1px solid #ece9f7;font-size:12px;font-weight:600;color:#666;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:background 0.3s ease,border-color 0.3s ease,color 0.3s ease,transform .15s ease}
.cat-chip.active{background:linear-gradient(135deg,#7c3aed,#c026d3);color:#fff;border-color:transparent;box-shadow:0 4px 10px rgba(124,58,237,.3)}
.product-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:0 16px;width:100%}
.product-card{border:1px solid #ece9f7;border-radius:16px;overflow:hidden;background:#fff;cursor:pointer;box-shadow:0 3px 10px rgba(124,58,237,.06);display:flex;flex-direction:column;transition:transform .2s ease;content-visibility:auto;contain-intrinsic-size:0 260px;contain:layout style paint}
.product-card:hover{transform:translateY(-4px)}

.product-img-wrap{width:100%;aspect-ratio:1;position:relative;overflow:hidden;background:#f5f5f5}
.product-img-track{display:flex;height:100%;scroll-snap-type:x mandatory;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none;scroll-behavior:smooth;touch-action:pan-x}
.product-img-track::-webkit-scrollbar{display:none}
.product-img-slide{flex:0 0 100%;height:100%;scroll-snap-align:start;display:flex;align-items:center;justify-content:center;position:relative}
.product-img-slide img{width:100%;height:100%;object-fit:cover}
.product-img-slide .emoji-fallback{font-size:48px}
.product-badge{position:absolute;top:8px;left:8px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:4px 9px;border-radius:20px;background:linear-gradient(135deg,#1a1a1a,#3d3d3d);color:#fff;z-index:3}
.discount-badge{position:absolute;top:8px;right:8px;font-size:9px;font-weight:700;padding:4px 9px;border-radius:20px;background:linear-gradient(135deg,#ef4444,#f97316);color:#fff;z-index:3}
.img-nav-dots{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);display:flex;gap:4px;z-index:3}
.img-nav-dot{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.5);border:none;padding:0;transition:all 0.2s}
.img-nav-dot.active{background:#fff;width:12px;border-radius:3px}
.img-count{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.4);color:#fff;font-size:9px;font-weight:600;padding:2px 6px;border-radius:8px;z-index:3}

.product-info{padding:10px;flex:1;display:flex;flex-direction:column}
.product-name{font-size:12px;font-weight:600;margin:0 0 3px;line-height:1.3;transition:color 0.4s ease}
.price-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:2px}
.product-price-old{font-size:11px;color:#aaa}
.product-price{font-size:13px;font-weight:800;color:#7c3aed}
.product-price-discount{font-size:13px;font-weight:800;color:#ef4444}
.product-meta{font-size:10px;color:#aaa;margin-top:2px;flex:1;transition:color 0.4s ease}
.product-btn-row{display:flex;gap:6px;margin-top:8px}
.buy-now-btn{flex:1;padding:9px;border-radius:10px;border:none;background:linear-gradient(135deg,#7c3aed,#c026d3);color:#fff;font-size:11px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;transition:transform 0.2s ease,box-shadow 0.2s ease}
.buy-now-btn:active{transform:scale(.97)}
.buy-now-btn:hover{box-shadow:0 4px 12px rgba(124,58,237,.3)}
.add-cart-btn{flex:1;padding:9px;border-radius:10px;border:none;background:linear-gradient(135deg,#1a1a1a,#3d3d3d);color:#fff;font-size:11px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:4px;transition:transform 0.2s ease,box-shadow 0.2s ease}
.add-cart-btn:active{transform:scale(.97)}
.add-cart-btn:hover{box-shadow:0 4px 12px rgba(0,0,0,.25)}

.dark-section{padding:0 0 30px}
.dark-hero{height:150px;background:linear-gradient(145deg,#1a0b2e 0%,#3b1e6b 45%,#0f0a1e 100%);border-bottom:1px solid #2d1b4e;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;width:100vw;position:relative;left:50%;transform:translateX(-50%)}
.dark-hero h2{font-size:21px;font-weight:800;background:linear-gradient(135deg,#c4b5fd,#f0abfc);-webkit-background-clip:text;background-clip:text;color:transparent;margin:0}
.dark-hero p{font-size:12px;color:#6b6b7b;margin:4px 0 0}

.review-list{padding:0 16px}
.review-photo-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.review-photo{aspect-ratio:3/4;border-radius:14px;overflow:hidden;background:#12121a;border:1px solid #1a1a25;cursor:pointer;transition:transform .2s ease;content-visibility:auto;contain-intrinsic-size:0 200px;contain:layout style paint}
.review-photo:hover{transform:translateY(-3px)}
.review-photo img{width:100%;height:100%;object-fit:cover;display:block}
.review-empty{grid-column:1/-1;text-align:center;padding:50px 20px;color:#6b6b7b}
.review-empty-icon{font-size:40px;display:block;margin-bottom:10px}
.review-photo-overlay{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:260;padding:24px}
.review-photo-overlay.open{display:flex}
.review-photo-overlay img{max-width:100%;max-height:100%;border-radius:14px;box-shadow:0 10px 40px rgba(0,0,0,.5)}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:100;backdrop-filter:blur(3px)}
.modal-overlay.open{display:flex}
.modal-box{background:#fff;border-radius:16px 16px 0 0;width:100%;overflow:hidden;animation:slideUp .25s ease;max-height:85vh;overflow-y:auto}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}

/* ============ SKELETON LOADING ============ */
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
.skel{background:linear-gradient(90deg,#eceaf5 25%,#f5f3fb 37%,#eceaf5 63%);background-size:800px 100%;animation:shimmer 1.4s ease infinite;border-radius:10px}
.skel-carousel{width:100%;height:100%;border-radius:0}
.skel-card{border:1px solid #ece9f7;border-radius:16px;overflow:hidden;background:#fff;display:flex;flex-direction:column}
.skel-card .skel-img{aspect-ratio:1;border-radius:0}
.skel-card .skel-body{padding:10px;display:flex;flex-direction:column;gap:8px}
.skel-line{height:10px;border-radius:6px}
.skel-review{aspect-ratio:3/4;border-radius:14px}
.search-empty{grid-column:1/-1;text-align:center;padding:40px 16px;color:#aaa}
.search-empty span{font-size:32px;display:block;margin-bottom:8px}
.search-empty p{font-size:13px}
.modal-header{padding:16px;border-bottom:1px solid #e5e5e5;display:flex;align-items:center;justify-content:space-between}
.modal-header h4{margin:0;font-size:15px;font-weight:700}
.modal-close{width:30px;height:30px;border-radius:8px;border:1px solid #e5e5e5;background:#f5f5f5;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.modal-product{padding:14px 16px;display:flex;gap:12px;align-items:center;background:#f8f9fa}
.modal-thumb{width:44px;height:44px;border-radius:8px;background:#f0f0f0;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;overflow:hidden}
.modal-thumb img{width:100%;height:100%;object-fit:cover}
.modal-detail .name{font-size:13px;font-weight:600;margin:0}
.modal-detail .price-row{display:flex;align-items:center;gap:8px;margin-top:2px;flex-wrap:wrap}
.modal-detail .price-old{font-size:12px;color:#aaa;text-decoration:line-through}
.modal-detail .price{font-size:15px;font-weight:700;margin:0}
.modal-detail .price-discount{font-size:15px;font-weight:700;color:#ef4444;margin:0}
.modal-detail .discount-tag{font-size:10px;background:#ef4444;color:#fff;padding:2px 6px;border-radius:4px;font-weight:700}
.modal-body{padding:14px 16px 20px}
.modal-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:#888;margin-bottom:10px}
.pay-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.pay-option{border:1.5px solid #e5e5e5;border-radius:10px;padding:14px;text-align:center;cursor:pointer;background:#f8f9fa;position:relative;transition:border-color 0.2s ease,background 0.2s ease}
.pay-option.selected{border-color:#22c55e;background:rgba(34,197,94,.06)}
.pay-icon{font-size:20px;margin-bottom:4px;display:block}
.pay-name{font-size:12px;font-weight:600}
.pay-check{position:absolute;top:6px;right:6px;width:18px;height:18px;border-radius:50%;background:#22c55e;color:#fff;font-size:11px;display:none;align-items:center;justify-content:center}
.pay-option.selected .pay-check{display:flex}
.admin-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.admin-option{border:1.5px solid #e5e5e5;border-radius:10px;padding:14px;text-align:center;cursor:pointer;background:#f8f9fa;position:relative;transition:border-color 0.2s ease,background 0.2s ease}
.admin-option.selected{border-color:#25D366;background:rgba(37,211,102,.08)}
.admin-icon{font-size:20px;margin-bottom:4px;display:block}
.admin-name{font-size:12px;font-weight:600}
.admin-check{position:absolute;top:6px;right:6px;width:18px;height:18px;border-radius:50%;background:#25D366;color:#fff;font-size:11px;display:none;align-items:center;justify-content:center}
.admin-option.selected .admin-check{display:flex}
.wa-preview{margin-top:14px;padding:12px;border-radius:8px;border:1px dashed #d0d0d0;background:#f8f9fa}
.wa-preview-label{font-size:10px;font-weight:700;color:#888;text-transform:uppercase;margin-bottom:4px}
.wa-preview-text{font-size:12px;color:#555;line-height:1.5;margin:0}
.wa-btn{margin-top:10px;width:100%;padding:12px;border-radius:12px;border:none;background:linear-gradient(135deg,#22c55e,#16a34a);color:#fff;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 4px 12px rgba(34,197,94,.28)}

.cart-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:110;backdrop-filter:blur(3px)}
.cart-overlay.open{display:block}
.cart-panel{position:fixed;top:0;right:0;width:100%;max-width:380px;height:100dvh;background:#fff;display:flex;flex-direction:column;z-index:111;transform:translateX(100%);transition:transform .3s ease}
.cart-panel.open{transform:translateX(0)}
.cart-header{padding:16px;border-bottom:1px solid #e5e5e5;display:flex;align-items:center;justify-content:space-between;position:relative;z-index:2;background:#fff;flex-shrink:0}
.cart-header h3{margin:0;font-size:16px;font-weight:700}
.cart-close{width:32px;height:32px;border-radius:8px;border:1px solid #e5e5e5;background:#f5f5f5;font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.cart-body{flex:1;overflow-y:auto;padding:16px;position:relative;z-index:1}
.cart-empty{text-align:center;padding:40px 20px;color:#aaa}
.cart-empty-icon{font-size:48px;margin-bottom:12px;display:block}
.cart-item{display:flex;gap:12px;padding:12px;border:1px solid #e8e8e8;border-radius:10px;margin-bottom:10px;align-items:center;background:#fafafa}
.cart-item-thumb{width:40px;height:40px;border-radius:8px;background:#f0f0f0;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;overflow:hidden}
.cart-item-thumb img{width:100%;height:100%;object-fit:cover}
.cart-item-info{flex:1;min-width:0}
.cart-item-name{font-size:13px;font-weight:600;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cart-item-price-row{display:flex;align-items:center;gap:6px;margin-top:2px;flex-wrap:wrap}
.cart-item-price-old{font-size:11px;color:#aaa;text-decoration:line-through}
.cart-item-price{font-size:12px;color:#7c3aed;font-weight:700}
.cart-item-price-discount{font-size:12px;color:#ef4444;font-weight:700}
.cart-item-qty{display:flex;align-items:center;gap:6px;margin-top:4px}
.qty-btn{width:24px;height:24px;border-radius:6px;border:1px solid #e5e5e5;background:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer}
.qty-btn:active{background:#f0f0f0}
.qty-num{font-size:12px;font-weight:600;min-width:20px;text-align:center}
.cart-item-remove{width:28px;height:28px;border-radius:6px;border:1px solid #fee2e2;background:#fef2f2;color:#ef4444;font-size:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.cart-item-remove:active{background:#fee2e2}
.cart-footer{padding:16px;border-top:1px solid #e5e5e5;background:#fafafa}
.cart-checkout-step{padding:16px;border-top:1px solid #e5e5e5;background:#fafafa;overflow-y:auto;flex:1}
.cart-subtotal-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.cart-subtotal-label{font-size:11px;color:#888}
.cart-subtotal-price{font-size:12px;color:#aaa;text-decoration:line-through}
.cart-discount-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.cart-discount-label{font-size:11px;color:#22c55e}
.cart-discount-price{font-size:12px;color:#22c55e;font-weight:700}
.cart-total-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.cart-total-label{font-size:13px;font-weight:600;color:#555}
.cart-total-price{font-size:18px;font-weight:800;color:#1a1a1a}
.cart-total-price-discount{font-size:18px;font-weight:800;color:#ef4444}
.cart-checkout{width:100%;padding:13px;border-radius:12px;border:none;background:linear-gradient(135deg,#7c3aed,#c026d3);color:#fff;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 4px 14px rgba(124,58,237,.3);transition:transform .15s ease}
.cart-checkout:active{transform:scale(.98)}
.cart-clear{font-size:11px;color:#888;text-align:center;margin-top:8px;cursor:pointer;text-decoration:underline}

.pw-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:250;backdrop-filter:blur(4px);padding:16px}
.pw-overlay.open{display:flex}
.pw-box{background:#fff;border-radius:16px;width:100%;max-width:340px;overflow:hidden;animation:popIn .2s ease}
.pw-header{padding:20px 16px 12px;text-align:center}
.pw-header h4{margin:0;font-size:16px;font-weight:800}
.pw
